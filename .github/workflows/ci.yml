name: CI

on:
  pull_request:
  workflow_dispatch:

jobs:
  validate:
    runs-on: ubuntu-latest
    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Setup Bun
        uses: oven-sh/setup-bun@v2
        with:
          bun-version: 1.3.11

      - name: Install dependencies
        run: bun install --frozen-lockfile

      - name: Validate generated content
        run: bun run content

      - name: Check TypeScript
        run: bun run typecheck

      - name: Check published NCA scripts
        run: python3 scripts/qa/export-nca-examples.py --check

      - name: Run tests
        run: bun test

      - name: Build site
        run: bun run build

      - name: Check built pages and article links
        run: bun run check:build
